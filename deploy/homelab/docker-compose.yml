# Homelab stack for the crypto Discord bot.
#
#   mongo       - persistent store for alerts, feature config and sessions
#   bot         - the Discord bot + dashboard, internal only (cloudflared fronts it)
#   cloudflared - named tunnel exposing the dashboard on its public hostname
#
# Driven by deploy/homelab/deploy.sh (run from your Mac). Variables come from
# deploy/homelab/.env.homelab, which deploy.sh ships and passes as --env-file.

name: discord-bot

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Bound to loopback only - the LAN still can't reach it, but the host
    # itself can, which is what lets `tailscale serve` front it as a fallback
    # path when the Cloudflare tunnel's public hostname is unavailable.
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-4300}:${DASHBOARD_PORT:-4300}'
    volumes:
      - bot-logs:/var/log/bot
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: ${MONGO_DB:-discord_bot}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Written to the named volume below, so a redeploy does not destroy the
      # logs the redeploy is usually followed by reading.
      LOG_DIR: /var/log/bot
      PRICE_POLL_SECONDS: ${PRICE_POLL_SECONDS:-60}
      LAUNCH_POLL_SECONDS: ${LAUNCH_POLL_SECONDS:-45}
      TRACK_POLL_SECONDS: ${TRACK_POLL_SECONDS:-60}
      ENABLE_PUMPPORTAL: ${ENABLE_PUMPPORTAL:-true}
      ENABLE_MESSAGE_CONTENT: ${ENABLE_MESSAGE_CONTENT:-true}
      # Off until validated against a real Solana RPC - see CLAUDE.md /
      # docs/11-RUG-SIGNATURE.md. Neither the automatic scan nor /rugcheck
      # runs while this is false.
      ENABLE_RUG_SIGNATURE_CHECK: ${ENABLE_RUG_SIGNATURE_CHECK:-true}
      # Volume monitor. Everything below is optional: with no Helius key and no
      # RPC URLs the monitor still runs spike and momentum alerts on every chain
      # and reports whale detection as unavailable rather than guessing at it.
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_POLL_SECONDS: ${MONITOR_POLL_SECONDS:-60}
      MONITOR_MAX_TOKENS: ${MONITOR_MAX_TOKENS:-120}
      MONITOR_STATUS_CHANNEL_ID: ${MONITOR_STATUS_CHANNEL_ID:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      HELIUS_WEBHOOK_SECRET: ${HELIUS_WEBHOOK_SECRET:-}
      HELIUS_WEBHOOK_URL: ${HELIUS_WEBHOOK_URL:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      # Blank is fine - config.ts falls back to Robinhood's keyless public RPC.
      ROBINHOOD_RPC_URL: ${ROBINHOOD_RPC_URL:-}
      # Websockets turn the poll into a push. A chain without one keeps working
      # at poll speed, so every one of these is safe to leave blank.
      ETHEREUM_WS_URL: ${ETHEREUM_WS_URL:-}
      BSC_WS_URL: ${BSC_WS_URL:-}
      BASE_WS_URL: ${BASE_WS_URL:-}
      ROBINHOOD_WS_URL: ${ROBINHOOD_WS_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_WS_URL: ${SOLANA_WS_URL:-}
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-4300}
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_URL: ${DASHBOARD_URL}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      # Login + password accounts. Blank disables that sign-in path entirely.
      DASHBOARD_USERS: ${DASHBOARD_USERS:-}
      # Private signal intake. Blank URL or blank token means no request is ever
      # made, so a deploy that does not want it simply omits them from
      # .env.homelab - which is why every one of these carries a blank default.
      # NOTE: the URL is resolved from inside this container, so "localhost" is
      # the container itself. Use the host's LAN IP, or the intake's service
      # name if it shares this compose network.
      SIGNAL_INTAKE_URL: ${SIGNAL_INTAKE_URL:-}
      SIGNAL_INTAKE_TOKEN: ${SIGNAL_INTAKE_TOKEN:-}
      SIGNAL_INTAKE_SOURCE: ${SIGNAL_INTAKE_SOURCE:-fomo-scanner}
      SIGNAL_INTAKE_CHAINS: ${SIGNAL_INTAKE_CHAINS:-solana}
      # High-priority alerts mirrored to Telegram. Same blank-means-off rule.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Fomo activity monitor - the BOT's half. The sidecar has its own block
      # below; these are what decide whether the feature runs and whether the
      # ingest route mounts at all. Omitting them here means the bot starts with
      # Fomo off however the .env file reads, because compose only passes what
      # this block names.
      FOMO_ENABLED: ${FOMO_ENABLED:-false}
      FOMO_INGEST_SECRET: ${FOMO_INGEST_SECRET:-}
      FOMO_ALERT_TELEGRAM_CHAT: ${FOMO_ALERT_TELEGRAM_CHAT:-}
      FOMO_MAX_EVENT_AGE_MIN: ${FOMO_MAX_EVENT_AGE_MIN:-10}
      FOMO_STALE_MIN: ${FOMO_STALE_MIN:-60}
      FOMO_MIN_USD: ${FOMO_MIN_USD:-0}
      # Holdings page - reads these two wallets' on-chain balances directly.
      # Same blank-means-off rule as above.
      HOLDINGS_SOLANA_WALLET: ${HOLDINGS_SOLANA_WALLET:-}
      HOLDINGS_EVM_WALLET: ${HOLDINGS_EVM_WALLET:-}
      HOLDINGS_EVM_CHAINS: ${HOLDINGS_EVM_CHAINS:-ethereum,base,robinhood}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:' + (process.env.DASHBOARD_PORT || 4300) + '/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Drives a real browser against fomo.family and forwards trading_activity to
  # the bot. Separate container because Playwright's browsers are built against
  # glibc and the bot image is node:alpine - and because a Chrome crash must not
  # be able to take the bot with it.
  fomo-sidecar:
    build:
      context: ./fomo-sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bot:
        condition: service_healthy
    environment:
      # MUST be an app route. https://fomo.family/ is a static marketing page:
      # it opens no websocket, so a sidecar pointed there looks healthy and
      # delivers nothing forever.
      FOMO_APP_URL: ${FOMO_APP_URL:-https://fomo.family/token}
      FOMO_PROFILE_PATH: /profile
      # Headed under Xvfb - the app does not boot in headless Chromium.
      FOMO_HEADLESS: 'false'
      FOMO_BOT_URL: http://bot:${DASHBOARD_PORT:-4300}
      FOMO_INGEST_SECRET: ${FOMO_INGEST_SECRET}
      FOMO_HEARTBEAT_SEC: ${FOMO_HEARTBEAT_SEC:-60}
      FOMO_IDLE_RELOAD_MIN: ${FOMO_IDLE_RELOAD_MIN:-30}
    volumes:
      - fomo-profile:/profile
    # Chrome is memory-hungry and this box runs ~40 containers. A cap turns a
    # browser leak into one restarted container instead of a squeezed host.
    mem_limit: 1500m
    shm_size: 512m

  # One-time login desktop. NOT part of the steady-state stack: it is in the
  # `login` compose profile, so ordinary `up -d` never starts it.
  #
  #   docker compose -p discord-bot stop fomo-sidecar
  #   docker compose -p discord-bot --profile login up -d fomo-login
  #   ... log in at the tunnel hostname ...
  #   docker compose -p discord-bot --profile login down fomo-login
  #   docker compose -p discord-bot start fomo-sidecar
  #
  # The stop/start matters: Chrome locks the profile directory, so the sidecar
  # and this container can never hold it at the same time.
  fomo-login:
    profiles: ['login']
    build:
      context: ./fomo-login
      dockerfile: Dockerfile
    restart: 'no'
    environment:
      # Refuses to start without this. What is behind it is a browser holding a
      # live Google session, so an unauthenticated one is not an option.
      VNC_PASSWORD: ${FOMO_VNC_PASSWORD}
      START_URL: ${FOMO_APP_URL:-https://fomo.family/token}
    volumes:
      - fomo-profile:/profile
    # Loopback only, exactly as the bot binds above: the LAN cannot reach it,
    # but the host can, which is what lets `tailscale serve` front it. Reached
    # over the tailnet at https://dohbelisk.tail2a8e5f.ts.net:8443 - never over
    # a public hostname. What answers here is a browser holding a live Google
    # session with a route into the LAN, so "authenticated by being on the
    # tailnet" is the whole security model and there is no second door.
    ports:
      - '127.0.0.1:6080:6080'
    mem_limit: 2g
    shm_size: 512m

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # The image runs as a non-root uid that can't read the host-owned (0600/0400)
    # mounted config + creds; run as root so it can, without loosening creds perms.
    user: root
    command: ['tunnel', '--no-autoupdate', '--config', '/etc/cloudflared/config.yml', 'run']
    volumes:
      - ./cloudflared:/etc/cloudflared:ro # config.yml + <tunnel-id>.json (shipped by deploy.sh)
    depends_on:
      bot:
        condition: service_healthy

volumes:
  # Named volume - alerts, feature config and sessions live here and survive
  # redeploys. Never remove this without an explicit decision.
  mongo-data:
  # Dated log files, pruned after 14 days by the app. Survives `up --build`,
  # which is the whole point: Docker's own logs do not.
  bot-logs:
  # The Chrome profile holding the Fomo session. Written by fomo-login, read by
  # fomo-sidecar. This is a CREDENTIAL - it is what a logged-in Fomo (and
  # Google) session looks like on disk. Never bake it into an image, never copy
  # it off the host, and remove it if the account is ever retired.
  fomo-profile:
